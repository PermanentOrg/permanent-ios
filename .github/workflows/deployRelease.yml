name: Deploy TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ "Release-**" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-26
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Update Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.0'
          bundler-cache: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Cache Swift packages
        uses: actions/cache@v3
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Run Unit Tests
        env:
          CLIENT_ID: ${{ secrets.IOS_FIREBASE_CLIENT_ID }}
          REVERSED_CLIENT_ID: ${{ secrets.IOS_FIREBASE_REVERSED_CLIENT_ID }}
          API_KEY: ${{ secrets.IOS_FIREBASE_API_KEY }}
          GCM_SENDER_ID: ${{ secrets.IOS_FIREBASE_GCM_SENDER_ID }}
          PROJECT_ID: ${{ secrets.IOS_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.IOS_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APP_ID: ${{ secrets.IOS_FIREBASE_GOOGLE_APP_ID }}
          AUTH_TENANT_ID: ${{ secrets.MOBILE_PROD_AUTH_TENANT_ID }}
          AUTH_CLIENT_ID: ${{ secrets.MOBILE_PROD_AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET: ${{ secrets.MOBILE_PROD_AUTH_CLIENT_SECRET }}
          STRIPE_PUB_KEY: ${{ secrets.MOBILE_PROD_STRIPE_PUB_KEY }}
          SKIPLINT: true
          TEST_PLAN: 'unit-tests'
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 10
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 6
        shell: bash
        run: bundle exec fastlane tests 2>&1 | tee fastlane-tests.log
      - name: List failed tests
        if: failure()
        shell: bash
        run: |
          # fastlane prefixes and colours every line, so GitHub only picks up the ::error lines when printed plain.
          perl -pe 's/\e\[[0-9;]*m//g' fastlane-tests.log | grep -o '::error .*' | sed "s#${GITHUB_WORKSPACE}/##" | sort -u > failures.txt || true
          if [ -s failures.txt ]; then
            cat failures.txt
            {
              echo "### Failed tests and build errors"
              sed -E -e 's/^::error file=([^,]*),line=([0-9]+)[^:]*::[[:space:]]*(.*)$/- `\1:\2` \3/' -e 's/^::error [^:]*::[[:space:]]*(.*)$/- \1/' failures.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No failed test was found. Search the Run Unit Tests step for 'error:'."
          fi

  build:
    needs: test
    name: Build and deploy a release build to TestFlight
    runs-on: macos-26
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Update Bundler
        uses: ruby/setup-ruby@v1
        with: 
          ruby-version: '3.1.0'
          bundler-cache: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Cache Swift packages
        uses: actions/cache@v3
        with:
          path: SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Run Fastlane AppStore
        env:
          CLIENT_ID: ${{ secrets.IOS_FIREBASE_CLIENT_ID }}
          REVERSED_CLIENT_ID: ${{ secrets.IOS_FIREBASE_REVERSED_CLIENT_ID }}
          API_KEY: ${{ secrets.IOS_FIREBASE_API_KEY }}
          GCM_SENDER_ID: ${{ secrets.IOS_FIREBASE_GCM_SENDER_ID }}
          PROJECT_ID: ${{ secrets.IOS_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.IOS_FIREBASE_STORAGE_BUCKET }}
          GOOGLE_APP_ID: ${{ secrets.IOS_FIREBASE_GOOGLE_APP_ID }}
          AUTH_TENANT_ID: ${{ secrets.MOBILE_PROD_AUTH_TENANT_ID }}
          AUTH_CLIENT_ID: ${{ secrets.MOBILE_PROD_AUTH_CLIENT_ID }}
          AUTH_CLIENT_SECRET: ${{ secrets.MOBILE_PROD_AUTH_CLIENT_SECRET }}
          STRIPE_PUB_KEY: ${{ secrets.MOBILE_PROD_STRIPE_PUB_KEY }}
          UI_TEST_USERNAME: ${{ secrets.IOS_UI_TEST_USERNAME }}
          UI_TEST_PASSWORD: ${{ secrets.IOS_UI_TEST_PASSWORD }}
          SKIPLINT: true
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          FASTLANE_MATCH_TOKEN: ${{ secrets.FASTLANE_MATCH_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 10
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 6
        run: bundle exec fastlane app_store
